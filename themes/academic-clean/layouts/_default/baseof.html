<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ if not .IsHome }}{{ .Title }} | {{ end }}{{ .Site.Title }}</title>
  <meta name="description" content="{{ .Site.Params.description }}">
  <meta name="robots" content="index, follow">
  <meta name="google-site-verification" content="E8Cz_ZCLKAFtXgyfxeigQlWzumD0pS2pVluBZpc85Cg">
  <link rel="canonical" href="{{ .Permalink }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@300;400;600;700&family=Roboto+Slab:wght@400;700&display=swap" rel="stylesheet">
  <link rel="icon" href="{{ "favicon.ico" | relURL }}?v=2" sizes="any">
  <link rel="icon" href="{{ "favicon.svg" | relURL }}?v=2" type="image/svg+xml">
  <link rel="icon" href="{{ "favicon-32.png" | relURL }}?v=2" type="image/png" sizes="32x32">
  <link rel="apple-touch-icon" href="{{ "apple-touch-icon.png" | relURL }}?v=2">
  <link rel="stylesheet" href="{{ "css/style.css" | relURL }}?v=20261011-6">
</head>
<body>
  {{ partial "nav.html" . }}
  <main>
    {{ block "main" . }}{{ end }}
  </main>
  {{ partial "footer.html" . }}
</body>
</html>
